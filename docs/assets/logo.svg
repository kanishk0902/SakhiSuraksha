<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Sakhi Suraksha logo">
  <defs>
    <linearGradient id="ss-petalOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a0e5c"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <linearGradient id="ss-petalMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e1b6f"/>
      <stop offset="1" stop-color="#e91e63"/>
    </linearGradient>
    <linearGradient id="ss-petalInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d81b7a"/>
      <stop offset="1" stop-color="#ff6f91"/>
    </linearGradient>
    <linearGradient id="ss-figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde4d6"/>
      <stop offset="1" stop-color="#f3b49b"/>
    </linearGradient>
    <linearGradient id="ss-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a0e4d"/>
      <stop offset="1" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <!-- ===== emblem: symmetric lotus cradling a figure, centred at x=320 ===== -->
  <g>
    <!-- outer side petals -->
    <path d="M320 296 C 250 268 210 214 218 152 C 262 172 300 214 320 270 Z" fill="url(#ss-petalOuter)"/>
    <path d="M320 296 C 390 268 430 214 422 152 C 378 172 340 214 320 270 Z" fill="url(#ss-petalOuter)"/>
    <!-- mid petals -->
    <path d="M320 298 C 274 256 254 198 266 142 C 304 172 324 220 324 274 Z" fill="url(#ss-petalMid)"/>
    <path d="M320 298 C 366 256 386 198 374 142 C 336 172 316 220 316 274 Z" fill="url(#ss-petalMid)"/>
    <!-- low cradle petals -->
    <path d="M320 300 C 264 300 214 288 184 262 C 224 238 280 244 316 276 Z" fill="url(#ss-petalInner)"/>
    <path d="M320 300 C 376 300 426 288 456 262 C 416 238 360 244 324 276 Z" fill="url(#ss-petalInner)"/>

    <!-- central figure: head + veil + softly tapering gown -->
    <path d="M320 292
             C 305 292 296 272 296 244
             C 296 210 304 178 320 150
             C 336 178 344 210 344 244
             C 344 272 335 292 320 292 Z" fill="url(#ss-figure)"/>
    <circle cx="320" cy="130" r="21" fill="url(#ss-figure)"/>
    <!-- veil sweeping off the head -->
    <path d="M320 109
             C 302 112 292 128 296 150
             C 281 141 278 118 292 102
             C 301 92 313 105 320 109 Z" fill="#3a0e4d"/>
  </g>

  <!-- ===== wordmark ===== -->
  <text x="320" y="366" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700"
        fill="url(#ss-title)">Sakhi <tspan fill="#d81b60">Suraksha</tspan></text>

  <text x="320" y="394" text-anchor="middle"
        font-family="Verdana, Geneva, sans-serif" font-size="12.5" letter-spacing="4"
        fill="#7a2a63">SAFE WOMEN &#183; STRONGER TOMORROW</text>
</svg>
